


# riscv64 became an official Debian release architecture in Debian 13, so
# unlike Ubuntu there is no codename-only path and no u-boot pin needed: the
# image ships an EFI grub on the ESP and boots under stock EDK2.
VM_VHD_LINK="https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-riscv64.qcow2"
VM_OS_NAME="debian"
VM_SSH_PORT=2222
VM_RELEASE=13

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="shutdown -h now"

VM_INSTALL_CMD="DEBIAN_FRONTEND=noninteractive apt-get install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-common"

VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

VM_ARCH=riscv64
VM_NIC=virtio

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# riscv64 is emulated (TCG) on the x86 runner. Debian uses sshd socket
# activation like Ubuntu, so the first ssh@.service cold start can take
# 30-60 s and the default 10 s ssh probe would report every retry as a
# connection timeout. Give it 90 s (same value ubuntu-builder settled on).
VM_SSH_READY_TIMEOUT=90

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
