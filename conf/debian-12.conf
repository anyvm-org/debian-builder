


# Debian 12 "bookworm" is oldstable (12.15 as of this writing) and still
# receives point releases, so latest/ stays live. See conf/debian-13.conf for
# why the "generic" variant is used.
VM_VHD_LINK="https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2"
VM_OS_NAME="debian"
VM_SSH_PORT=2222
VM_RELEASE=12

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="shutdown -h now"

VM_INSTALL_CMD="DEBIAN_FRONTEND=noninteractive apt-get install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-common"

VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

VM_NIC=virtio

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
