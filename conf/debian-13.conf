


# Debian publishes official cloud qcow2 images under a per-codename path with
# a stable "latest/" pointer, so the URL does not carry a build datestamp and
# does not rot between point releases (13.6 as of this writing).
#
# The "generic" variant is used rather than "genericcloud": generic carries
# the full driver set and is built for all four architectures Debian ships
# cloud images for, while genericcloud is virtio-only and exists for amd64
# and arm64 only. "nocloud" is deliberately NOT used -- it has no cloud-init
# at all, and hooks/host_prepareImage.sh writes a cloud-init datasource file.
#
# WHY THIS BUILDER HAS NO hooks/upstream_check.py.  The path is keyed by
# CODENAME ("trixie") while the filename is keyed by NUMBER ("debian-13-").
# The watcher lands a new release by substituting version tokens in this URL,
# and a codename is not derivable from a release number -- bumping 13 -> 14
# would yield ".../trixie/latest/debian-14-generic-amd64.qcow2", which does
# not exist. The watcher's HEAD gate would catch that and abort, so nothing
# breaks, but every run after the next Debian release would fail loudly for
# no reason. A no-hook builder is a supported state (watch.py exits 0 with
# "nothing to watch"), so a new Debian release gets a hand-written conf
# instead. The codename for release N is the "Codename:" field of
# https://deb.debian.org/debian/dists/stable/Release.
VM_VHD_LINK="https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
VM_OS_NAME="debian"
VM_SSH_PORT=2222
VM_RELEASE=13

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="shutdown -h now"

VM_INSTALL_CMD="DEBIAN_FRONTEND=noninteractive apt-get install -y "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-common"

# The cloud image's pre-baked apt indexes are not guaranteed usable, so the
# install step refreshes them first (see hooks/vm_installpkgs.sh).
VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

VM_NIC=virtio

# The Debian cloud image has no console password and no SSH key out of the
# box. hooks/host_prepareImage.sh bakes in root SSH access with virt-customize
# before the first boot; hooks/host_waitForLoginTag.sh and
# hooks/host_enablessh.sh then drive the rest over SSH, so we stay on the
# serial console instead of fragile VNC OCR.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
